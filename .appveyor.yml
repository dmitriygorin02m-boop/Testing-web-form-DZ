
image: Ubuntu2004

stack: jdk 11

branches:
    only:
        - main

build: off

install:
    - java -version
    - java -jar ./artifacts/app-order.jar > app.log 2>&1 &
    - chmod +x gradlew
    - |
        for i in {1..30}; do
          if curl -fsS http://localhost:9999 > /dev/null; then
            echo "Application is ready!"
            break
          fi
          sleep 2
        done
    - |
        curl -fsS http://localhost:9999 > /dev/null || {
          echo "Application failed to start!"
          cat app.log
          exit 1
        }

build_script:
    - ./gradlew test --info
